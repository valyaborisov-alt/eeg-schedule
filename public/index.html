<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fb"><title>Видео-ЭЭГ — расписание</title><link rel="stylesheet" href="/styles.css?v=20261002-1205"><script src="https://accounts.google.com/gsi/client" defer></script></head><body>
<header><div class="brand"><b>Видео-ЭЭГ</b><small>расписание кабинетов</small></div><nav><button data-view="day">День</button><button data-view="week" class="active">Неделя</button><button data-view="month">Месяц</button><button data-view="report">Отчёт</button></nav><div class="actions"><button id="usersBtn" type="button" hidden>Пользователи</button><button id="rangeSyncBtn" type="button" hidden title="Синхронизация диапазона">Синхронизация</button><button id="themeBtn" type="button" title="Переключить тему">◐</button><button id="googleBtn">G Подключить</button><button id="googleLogoutBtn" type="button" hidden title="Выйти из Google">Выйти</button><span id="userBadge" class="userBadge" hidden></span><button id="nursesBtn" type="button">Медсёстры</button><button id="addBtn" class="primary">+ Запись</button></div></header>
<section class="toolbar"><button id="prev">‹</button><button id="today">Сегодня</button><button id="next">›</button><h1 id="period"></h1></section>
<div id="accessGate" class="accessGate" hidden><div><h2>Расписание Видео-ЭЭГ</h2><p id="accessMessage">Войдите через Google для доступа к расписанию.</p><button id="accessLogin" type="button" class="primary">Войти через Google</button></div></div><main id="appMain"><div id="calendar"></div></main>
<dialog id="eventDialog"><form id="eventForm" method="dialog"><h2 id="formTitle">Новая запись</h2><input type="hidden" id="eventId"><div class="grid">
<label>ФИО пациента<input id="patient" required></label><label>Дата рождения<input id="birthDate" type="date"></label><label>Возраст<input id="age" inputmode="numeric" placeholder="рассчитается автоматически"></label>
<label>Тип<select id="careType"><option>Амбулаторно</option><option>Стационарно</option></select></label><label>Телефон<input id="phone" type="tel"></label>
<label>Дата<input id="date" type="date" required></label><label>Кабинет<select id="room"><option value="1">Кабинет 1</option><option value="2">Кабинет 2</option></select></label>
<label>Метка<select id="color"><option value="#0f8b8d">Бирюзовая</option><option value="#7667d8">Фиолетовая</option><option value="#2f6feb">Синяя</option><option value="#e58b24">Оранжевая</option><option value="#c84f74">Розовая</option><option value="#438a4b">Зелёная</option></select></label>
<label>Начало<input id="start" type="time" step="1800"></label><label>Окончание<input id="end" type="time" step="1800"></label></div>
<label>Комментарий<textarea id="comment" rows="2"></textarea></label><div class="dialogActions"><button type="button" id="deleteBtn" class="danger">Удалить</button><span></span><button type="button" id="cancelBtn">Отмена</button><button type="submit" class="primary">Сохранить</button></div></form></dialog>
<script src="/app.js?v=20261002-1205"></script><script src="/google.js?v=20261002-1205"></script><dialog id="nursesDialog"><form method="dialog" class="nursesEditor"><h2>Медсёстры</h2><div id="nursesList"></div><div class="nurseAdd"><input id="newNurse" placeholder="Фамилия или ФИО"><button id="addNurseBtn" type="button">+ Добавить</button></div><div class="dialogActions"><button id="closeNursesBtn" type="button">Закрыть</button></div></form></dialog><script src="/nurses.js?v=20261002-1205"></script><dialog id="syncDialog"><form id="syncRangeForm"><h2>Синхронизация расписания</h2><div class="grid"><label>С даты<input id="syncFrom" type="date" required></label><label>По дату<input id="syncTo" type="date" required></label></div><p class="syncHint">Существующие записи будут обновлены, недостающие — добавлены. Записи вне диапазона не изменяются.</p><div class="dialogActions"><span></span><span></span><button type="button" id="syncCancel">Отмена</button><button class="primary" type="submit">Синхронизировать</button></div></form></dialog><dialog id="usersDialog"><div class="usersPanel"><h2>Пользователи</h2><form id="addUserForm" class="addUserForm"><input id="newUserEmail" type="email" placeholder="email@gmail.com" required><select id="newUserRole"><option value="viewer">Просмотр</option><option value="editor">Редактор</option><option value="admin">Администратор</option></select><button class="primary" type="submit">Добавить</button></form><div id="usersList"></div><div class="dialogActions"><span></span><span></span><button id="usersClose" type="button">Закрыть</button></div></div></dialog></body></html>
