<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fb"><title>Видео-ЭЭГ — расписание</title><link rel="stylesheet" href="/styles.css"><script src="https://accounts.google.com/gsi/client" async defer></script></head><body>
<header><div class="brand"><b>Видео-ЭЭГ</b><small>расписание кабинетов</small></div><nav><button data-view="day">День</button><button data-view="week" class="active">Неделя</button><button data-view="month">Месяц</button></nav><div class="actions"><button id="googleBtn">G Подключить</button><button id="syncBtn">↻</button><button id="addBtn" class="primary">+ Запись</button></div></header>
<section class="toolbar"><button id="prev">‹</button><button id="today">Сегодня</button><button id="next">›</button><h1 id="period"></h1></section>
<main><div id="calendar"></div></main>
<dialog id="eventDialog"><form id="eventForm" method="dialog"><h2 id="formTitle">Новая запись</h2><input type="hidden" id="eventId"><div class="grid">
<label>ФИО пациента<input id="patient" required></label><label>Возраст<input id="age" inputmode="numeric" placeholder="например, 8"></label>
<label>Тип<select id="careType"><option>Амбулаторно</option><option>Стационарно</option></select></label><label>Телефон<input id="phone" type="tel"></label>
<label>Дата<input id="date" type="date" required></label><label>Кабинет<select id="room"><option value="1">Кабинет 1</option><option value="2">Кабинет 2</option></select></label>
<label>Исследование<select id="kind"><option>Видео-ЭЭГ</option><option>Дневной мониторинг</option><option>Ночной мониторинг</option></select></label><label>Цветная метка<select id="color"><option value="#0f8b8d">Бирюзовая</option><option value="#7667d8">Фиолетовая</option><option value="#2f6feb">Синяя</option><option value="#e58b24">Оранжевая</option><option value="#c84f74">Розовая</option><option value="#438a4b">Зелёная</option></select></label>
<label>Начало<input id="start" type="time" step="1800"></label><label>Окончание<input id="end" type="time" step="1800"></label></div>
<label>Комментарий<textarea id="comment" rows="2"></textarea></label><div class="dialogActions"><button type="button" id="deleteBtn" class="danger">Удалить</button><span></span><button type="button" id="cancelBtn">Отмена</button><button type="submit" class="primary">Сохранить</button></div></form></dialog>
<script src="/app.js"></script><script src="/google.js"></script></body></html>
