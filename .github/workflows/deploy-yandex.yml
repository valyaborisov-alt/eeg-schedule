name: Deploy Yandex Cloud

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'yandex-function/**'
      - '.github/workflows/deploy-yandex.yml'
  workflow_dispatch:

concurrency:
  group: yandex-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Authenticate Yandex Cloud
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
        run: |
          printf '%s' "$YC_SA_JSON_CREDENTIALS" > "$RUNNER_TEMP/yc-key.json"
          yc config profile create github-actions
          yc config set service-account-key "$RUNNER_TEMP/yc-key.json"
          yc config set cloud-id "${{ secrets.YC_CLOUD_ID }}"
          yc config set folder-id "${{ secrets.YC_FOLDER_ID }}"

      - name: Deploy frontend to Object Storage
        run: |
         yc storage s3 cp ./public s3://eeg-schedule-web --recursive

      - name: Deploy backend function
        run: |
          cd yandex-function
          zip -qr "$RUNNER_TEMP/function.zip" .
          yc serverless function version create \
            --function-id d4etbpt51h3f27skuc9o \
            --runtime nodejs22 \
            --entrypoint index.handler \
            --memory 128m \
            --execution-timeout 10s \
            --source-path "$RUNNER_TEMP/function.zip" \
            --environment "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --environment "COOKIE_SECRET=${{ secrets.COOKIE_SECRET }}" \
            --environment "ALLOWED_USERS=${{ secrets.ALLOWED_USERS }}" \
            --environment "PUBLIC_BASE_URL=https://d5d5eedg829mo0b2umh8.g2n58e0c.apigw.yandexcloud.net"

      - name: Smoke test
        run: |
          curl --fail --show-error --silent https://d5d5eedg829mo0b2umh8.g2n58e0c.apigw.yandexcloud.net/api/calendar/save
