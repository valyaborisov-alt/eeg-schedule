name: Deploy Yandex Cloud

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'yandex-function/**'
      - '.github/workflows/deploy-yandex.yml'
  workflow_dispatch:

concurrency:
  group: yandex-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Authenticate Yandex Cloud
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
        run: |
          printf '%s' "$YC_SA_JSON_CREDENTIALS" > "$RUNNER_TEMP/yc-key.json"

          yc config profile create github-actions
          yc config set service-account-key "$RUNNER_TEMP/yc-key.json"
          yc config set cloud-id "${{ secrets.YC_CLOUD_ID }}"
          yc config set folder-id "${{ secrets.YC_FOLDER_ID }}"
          yc config set endpoint api.cloud.yandex.net:443

      - name: Deploy frontend to Object Storage
        run: |
          yc storage s3 cp ./public s3://eeg-schedule-web --recursive
          yc storage s3 cp ./public/index.html s3://eeg-schedule-web/index.html --content-type "text/html; charset=utf-8" --cache-control "no-cache, no-store, must-revalidate"
          yc storage s3 cp ./public/styles.css s3://eeg-schedule-web/styles.css --content-type "text/css"
          yc storage s3 cp ./public/app.js s3://eeg-schedule-web/app.js --content-type "application/javascript"
          yc storage s3 cp ./public/google.js s3://eeg-schedule-web/google.js --content-type "application/javascript"
          yc storage s3 cp ./public/nurses.js s3://eeg-schedule-web/nurses.js --content-type "application/javascript"

      - name: Deploy backend function
        run: |
          cd yandex-function

          zip -qr "$RUNNER_TEMP/function.zip" .

          yc serverless function version create \
            --endpoint api.cloud.yandex.net:443 \
            --function-id d4etbpt51h3f27skuc9o \
            --runtime nodejs22 \
            --entrypoint index.handler \
            --memory 128m \
            --execution-timeout 10s \
            --source-path "$RUNNER_TEMP/function.zip" \
            --environment "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --environment "COOKIE_SECRET=${{ secrets.COOKIE_SECRET }}" \
            --environment "ALLOWED_USERS=${{ secrets.ALLOWED_USERS }}" \
            --environment "PUBLIC_BASE_URL=https://d5d5eedg829mo0b2umh8.g2n58e0c.apigw.yandexcloud.net"

      - name: Smoke test
        run: |
          STATUS=$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            "https://d5d5eedg829mo0b2umh8.g2n58e0c.apigw.yandexcloud.net/api/calendar/save")

          echo "API returned HTTP $STATUS"

          if [ "$STATUS" = "000" ] || [ "$STATUS" -ge 500 ]; then
            echo "Smoke test failed"
            exit 1
          fi
